<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bionic Reading Studio</title>
<style>
:root{font:16px system-ui,sans-serif;color:#17253b;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#17253b;color:white;padding:28px max(20px,calc((100% - 1100px)/2))}h1{margin:0}header p{opacity:.8}main{max-width:1100px;margin:auto;padding:24px}.toolbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.toolbar label{display:flex;gap:8px;align-items:center}button,.upload{border:0;border-radius:9px;padding:10px 14px;background:#365cd6;color:white;font-weight:600;cursor:pointer}input[type=range]{width:105px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #dce2ee;border-radius:15px;padding:20px}h2{font-size:17px;margin-top:0}textarea{width:100%;height:360px;padding:14px;border:1px solid #cad3e2;border-radius:9px;resize:vertical;font:inherit;line-height:1.8}.preview{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;min-height:360px;font-size:19px}.preview b{font-weight:800}.status{color:#60708a;font-size:13px}body.dark{background:#151b26;color:#e7eef9}body.dark .panel{background:#232d3c;border-color:#46536a}body.dark textarea{background:#192434;color:white;border-color:#46536a}@media(max-width:760px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>Bionic Reading Studio</h1><p>Read with visual anchors, right in your browser.</p></header><main>
<div class="toolbar"><label>Bold fraction <input id="ratio" type="range" min="20" max="80" value="50"><output id="ratioValue">50%</output></label><label>Font size <input id="font" type="range" min="14" max="30" value="19"><output id="fontValue">19px</output></label><label>Dark mode <input id="dark" type="checkbox"></label><button id="copy">Copy text</button><button id="export">Download HTML</button><label class="upload">Convert EPUB <input id="epub" type="file" accept=".epub" hidden></label></div>
<div class="layout"><section class="panel"><h2>Original text</h2><textarea id="input" spellcheck="false">Reading becomes a different experience when the first part of each word is emphasized. Paste your own text to try it.</textarea></section><section class="panel"><h2>Live preview</h2><div id="preview" class="preview"></div></section></div><p class="status" id="status">Your text is processed locally in the browser. EPUB support loads JSZip from a CDN.</p>
</main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const $=id=>document.getElementById(id);
const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function convert(s,r){return s.replace(/[\p{L}]+(?:['’][\p{L}]+)*/gu,w=>{let n=Math.max(1,Math.ceil([...w].length*r));const a=[...w];return '<b>'+escapeHtml(a.slice(0,n).join(''))+'</b>'+escapeHtml(a.slice(n).join(''))}).replace(/&(?!(?:amp|lt|gt|quot|#39);)/g,'&amp;')}
function render(){const r=+$('ratio').value/100;$('ratioValue').textContent=$('ratio').value+'%';$('fontValue').textContent=$('font').value+'px';$('preview').style.fontSize=$('font').value+'px';$('preview').innerHTML=convert($('input').value,r)}
['input','ratio','font'].forEach(id=>$(id).addEventListener('input',render));$('dark').addEventListener('change',e=>document.body.classList.toggle('dark',e.target.checked));
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('preview').innerText);$('status').textContent='Converted text copied.'}catch(e){$('status').textContent='Clipboard unavailable; select and copy the preview manually.'}};
function save(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
$('export').onclick=()=>save(new Blob(['<!doctype html><meta charset="utf-8"><style>body{max-width:750px;margin:50px auto;padding:20px;font:19px/1.9 system-ui;white-space:pre-wrap}b{font-weight:800}</style>'+ $('preview').innerHTML],{type:'text/html'}),'bionic-reading.html');
$('epub').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(typeof JSZip==='undefined')throw Error('JSZip could not load. Check your internet connection.');$('status').textContent='Converting EPUB…';const zip=await JSZip.loadAsync(f),r=+$('ratio').value/100;let count=0;for(const [name,entry] of Object.entries(zip.files)){if(entry.dir||!/\.(xhtml|html|htm)$/i.test(name))continue;const raw=await entry.async('string');const doc=new DOMParser().parseFromString(raw,'application/xhtml+xml');if(doc.querySelector('parsererror'))continue;const walker=doc.createTreeWalker(doc.documentElement,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode()){const node=walker.currentNode;if(node.parentElement?.closest('head,script,style,svg,math,b,strong'))continue;if(/[\p{L}]/u.test(node.nodeValue))nodes.push(node)}for(const node of nodes){const holder=doc.createElement('span');holder.innerHTML=convert(node.nodeValue,r);const frag=doc.createDocumentFragment();while(holder.firstChild)frag.appendChild(holder.firstChild);node.replaceWith(frag)}zip.file(name,new XMLSerializer().serializeToString(doc));count++}if(!count)throw Error('No supported HTML/XHTML chapters found.');save(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),'bionic_'+f.name);$('status').textContent='Converted '+count+' chapter files. Download started.'}catch(err){$('status').textContent='EPUB conversion failed: '+err.message}finally{e.target.value=''}});render();
</script></body></html>
